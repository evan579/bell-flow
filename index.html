<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bell Flow</title>
<meta name="description" content="Beginner kettlebell mobility program with guided workouts, timers and a training log.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bell Flow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 560px), sticky top bar, fixed bottom tabs; a workout opens as a full-screen sheet over everything. */
:root {
  --bg: #EDEFEC;          /* chalk */
  --surface: #FFFFFF;
  --surface-2: #E2E5E1;
  --ink: #1B2026;         /* cast iron */
  --ink-2: #48515B;
  --ink-3: #737C86;
  --line: #D2D6D1;
  --accent: #2A52C4;      /* competition-bell blue */
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE3F8;
  --slab: #1E242A;        /* iron slab card */
  --slab-2: #2B333B;
  --slab-ink: #F1F3F0;
  --slab-mute: #A6AFB8;
  --slab-up: #8BE0AE;
  --good: #23784A;
  --good-soft: #D7EEDF;
  --warn: #9A6412;
  --warn-soft: #F5E7CC;
  --bad: #B03A32;
  --heat0: #E2E5E1;
  --heat1: #B9C8F0;
  --heat2: #7491E0;
  --heat3: #2A52C4;
  --f-display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", "Barlow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #1A1F24; --surface-2: #252B32; --ink: #E9ECE8; --ink-2: #B4BBC2; --ink-3: #87909A;
    --line: #2F363E; --accent: #809EFF; --accent-ink: #0B1433; --accent-soft: #1E2A4E;
    --slab: #242B33; --slab-2: #303842; --slab-ink: #F1F3F0; --slab-mute: #A6AFB8;
    --good: #5CC489; --good-soft: #17352A; --warn: #E3AC52; --warn-soft: #3A2D16; --bad: #EE8077;
    --heat0: #252B32; --heat1: #2C3D6E; --heat2: #4F6DC4; --heat3: #8FA9FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1A1F24; --surface-2: #252B32; --ink: #E9ECE8; --ink-2: #B4BBC2; --ink-3: #87909A;
  --line: #2F363E; --accent: #809EFF; --accent-ink: #0B1433; --accent-soft: #1E2A4E;
  --slab: #242B33; --slab-2: #303842; --slab-ink: #F1F3F0; --slab-mute: #A6AFB8;
  --good: #5CC489; --good-soft: #17352A; --warn: #E3AC52; --warn-soft: #3A2D16; --bad: #EE8077;
  --heat0: #252B32; --heat1: #2C3D6E; --heat2: #4F6DC4; --heat3: #8FA9FF;
  color-scheme: dark;
}

html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, a, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px)); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; background: var(--bg); }
.update-bar { position: fixed; z-index: 40; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 10px 10px 10px 16px; font-weight: 600; font-size: .92rem; }
.banner.wrap { flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: .01em; text-transform: uppercase; line-height: 1; }
.brand .bell { width: 22px; height: 24px; color: var(--accent); }
.topbar .spacer { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--ink-3); background: none; border: 0; padding: 6px 4px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync[data-s="cloud"] i { background: var(--good); }
.sync[data-s="syncing"] i { background: var(--warn); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 20px; height: 20px; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px; font-size: .74rem; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }

/* type */
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.h-display { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; line-height: .95; letter-spacing: .005em; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-block: 28px 10px; }
.sec-head h2 { font-family: var(--f-cond); font-weight: 700; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .03em; }
.muted { color: var(--ink-3); }
.small { font-size: .86rem; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; letter-spacing: .01em; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .9rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 12px; }
.slab { background: var(--slab); color: var(--slab-ink); border-radius: 18px; padding: 20px 18px 18px; position: relative; overflow: hidden; }
.slab .eyebrow { color: var(--slab-mute); }
.slab .meta { color: var(--slab-mute); font-size: .9rem; }
.slab h1 { font-size: clamp(2.3rem, 10vw, 3.2rem); margin-block: 6px 6px; }
.slab .why { margin-block: 12px 16px; font-size: .95rem; }
.slab .btn { border-color: var(--slab-2); background: var(--slab-2); color: var(--slab-ink); }
.slab .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.slab .ex-list { border-top: 1px solid var(--slab-2); margin-top: 16px; padding-top: 6px; }
.slab .ex-li { border-color: var(--slab-2); }
.slab .ex-li .t { color: var(--slab-mute); }
.slab > *:not(.slab-mark) { position: relative; }
.slab-mark { position: absolute; right: -18px; top: -10px; width: 120px; height: 130px; color: var(--slab-2); pointer-events: none; }

.ex-list { display: grid; }
.ex-li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ex-li:last-child { border-bottom: 0; }
.ex-li .n { font-weight: 600; min-width: 0; }
.ex-li .t { font-size: .88rem; color: var(--ink-3); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ex-li .sec { font-size: .66rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-right: 6px; }
.up { color: var(--good); font-weight: 700; }
.slab .up { color: var(--slab-up); }

.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; }
.banner p { font-weight: 600; }

.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.wd { display: grid; justify-items: center; gap: 4px; font-size: .72rem; color: var(--ink-3); font-weight: 600; }
.wd i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-ink); font-style: normal; }
.wd.on i { background: var(--accent); }
.wd.today span { color: var(--ink); }
.wd.today i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink-3); }
.wd i svg { width: 16px; height: 16px; }

.tip { display: flex; gap: 12px; align-items: flex-start; }
.tip .bell { width: 20px; height: 22px; color: var(--accent); flex: none; margin-top: 2px; }

.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qbtn { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; }
.qbtn b { font-family: var(--f-cond); font-size: 1.15rem; text-transform: uppercase; letter-spacing: .02em; }
.qbtn span { font-size: .85rem; color: var(--ink-3); }

/* plan */
.prog-bar { height: 8px; border-radius: 99px; background: var(--slab-2); overflow: hidden; margin-top: 14px; }
.prog-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.phase { display: grid; gap: 8px; }
.phase-head { display: flex; align-items: baseline; gap: 10px; margin-top: 22px; }
.phase-head h3 { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; text-transform: uppercase; line-height: 1; }
.phase-blurb { color: var(--ink-2); font-size: .92rem; max-width: 60ch; }
.week-row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.week-row .wk { font-family: var(--f-cond); font-weight: 700; text-transform: uppercase; font-size: 1rem; color: var(--ink-2); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 600; }
.pill.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill.next { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill.opt { border-style: dashed; color: var(--ink-3); }
.pill svg { width: 14px; height: 14px; }

/* chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: .88rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg .chip { text-align: center; padding-inline: 6px; }

/* bell chips */
.bells { display: flex; gap: 8px; flex-wrap: wrap; }
.bell-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 9px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--f-cond); font-weight: 700; font-size: 1.15rem; }
.bell-chip .bell { width: 18px; height: 20px; color: var(--ink-2); }
.bell-chip small { font-family: var(--f-body); font-size: .72rem; font-weight: 600; color: var(--ink-3); }
.bell-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.bell-chip[aria-pressed="true"] .bell { color: var(--accent); }

/* library */
.search { width: 100%; min-height: 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 18px; }
.lib-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.lib-item > button { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; display: grid; gap: 4px; }
.lib-item .nm { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.lib-item .nm b { font-size: 1.05rem; }
.lvl { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.lvl.l1 { color: var(--good); }
.tags { font-size: .84rem; color: var(--ink-3); }
.lib-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.cues { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; }
.cues li::marker { font-family: var(--f-cond); font-weight: 700; color: var(--accent); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: .92rem; }
.kv dt { color: var(--ink-3); font-weight: 600; }
.kv dd { margin: 0; min-width: 0; }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--ink-3); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .pt.sel { fill: var(--ink); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .cell { cursor: pointer; }
.chart .h0 { fill: var(--heat0); } .chart .h1 { fill: var(--heat1); } .chart .h2 { fill: var(--heat2); } .chart .h3 { fill: var(--heat3); }
.chart .todayc { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.chart .wc { fill: var(--ink-3); font-size: 10px; font-family: var(--f-body); font-weight: 600; }
.chart .wc.met { fill: var(--ink); font-weight: 700; }
.readout { font-size: .88rem; color: var(--ink-2); min-height: 1.4em; margin-top: 6px; }
.legend { display: flex; gap: 10px; align-items: center; font-size: .78rem; color: var(--ink-3); margin-top: 8px; flex-wrap: wrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -2px; margin-right: 3px; }
.select { min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; max-width: 100%; }
.hist-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.hist-item > button { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; display: grid; gap: 6px; }
.hist-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.hist-top b { font-size: 1.02rem; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: .76rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.hist-body { padding: 0 16px 14px; display: grid; gap: 10px; }
.hist-body .ex-li .t { white-space: normal; }
.empty { text-align: center; padding: 28px 18px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty .bell { width: 36px; height: 40px; color: var(--ink-3); }

/* player */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.pl-in { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 220px; }
.pl-top { display: flex; align-items: center; gap: 10px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.pl-title { flex: 1; min-width: 0; display: grid; }
.pl-title span:first-child { font-weight: 700; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-clock { font-family: var(--f-cond); font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pl-prog { display: flex; gap: 4px; margin-bottom: 18px; }
.pl-prog i { flex: 1; height: 5px; border-radius: 99px; background: var(--surface-2); }
.pl-prog i.d { background: var(--accent); }
.pl-prog i.c { background: var(--ink); }
.pl-name { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: clamp(2.5rem, 12vw, 3.6rem); line-height: .92; margin-block: 6px 8px; overflow-wrap: anywhere; }
.pl-target { font-family: var(--f-cond); font-weight: 700; font-size: 1.25rem; text-transform: uppercase; letter-spacing: .02em; color: var(--ink-2); }
.pl-note { margin-top: 10px; font-size: .92rem; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink-2); }
.pl-note.up { background: var(--good-soft); color: var(--good); font-weight: 600; }
.pl-block { margin-top: 18px; display: grid; gap: 10px; }
.pl-links { display: flex; gap: 16px; flex-wrap: wrap; font-weight: 600; font-size: .92rem; }
.sets { display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 52px 1fr auto 52px; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 8px 8px 14px; }
.set.done { background: var(--good-soft); border-color: transparent; }
.set-n { font-family: var(--f-cond); font-weight: 700; text-transform: uppercase; color: var(--ink-3); font-size: .95rem; }
.stepper { display: inline-flex; align-items: center; gap: 2px; justify-self: start; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.2rem; line-height: 1; }
.stepper span { min-width: 54px; text-align: center; font-family: var(--f-cond); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stepper span small { font-size: .7rem; font-family: var(--f-body); color: var(--ink-3); font-weight: 600; margin-left: 2px; }
.set-lb { font-size: .84rem; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.check { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.check svg { width: 22px; height: 22px; opacity: .25; }
.set.done .check { background: var(--good); border-color: var(--good); color: var(--surface); }
.set.done .check svg { opacity: 1; }
.go { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; height: 36px; padding: 0 12px; font-weight: 700; font-size: .85rem; display: inline-flex; align-items: center; gap: 4px; }
.go svg { width: 12px; height: 12px; }
.set-mid { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.pl-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pl-nav-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--slab); color: var(--slab-ink); border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
.timer-in { max-width: 560px; margin: 0 auto; padding: 14px 16px 16px; display: grid; gap: 6px; }
.tm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tm-label { font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--slab-mute); }
.tm-time { font-family: var(--f-display); font-weight: 800; font-size: 4.6rem; line-height: .9; font-variant-numeric: tabular-nums; }
.timer.pause .tm-label, .timer.pause .tm-time { color: var(--slab-up); }
.tm-next { color: var(--slab-mute); font-size: .92rem; }
.tm-bar { height: 6px; border-radius: 99px; background: var(--slab-2); overflow: hidden; }
.tm-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.tm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.tm-actions .btn { background: var(--slab-2); border-color: var(--slab-2); color: var(--slab-ink); }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(10, 13, 16, .5); }
.sheet-panel { position: relative; width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 2rem; text-transform: uppercase; line-height: .95; }
.field { display: grid; gap: 8px; margin-bottom: 18px; }
.field > label, .field > .lbl { font-weight: 700; font-size: .9rem; }
.input { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; }
textarea.input { min-height: 84px; padding: 10px 12px; resize: vertical; }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe .chip { padding: 8px 0; text-align: center; font-family: var(--f-cond); font-size: 1.05rem; border-radius: 10px; }
.hint { font-size: .84rem; color: var(--ink-3); }
.pick-list { display: grid; gap: 6px; }
.pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pick .tg { font-size: .8rem; color: var(--ink-3); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }
.hl { display: grid; gap: 8px; }
.hl div { display: flex; gap: 10px; align-items: baseline; }
.hl b { font-family: var(--f-cond); font-size: 1.1rem; }

@media (prefers-reduced-motion: no-preference) {
  .sheet-panel { animation: rise .22s ease-out; }
  .timer { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 380px) {
  .set { grid-template-columns: 44px 1fr auto 48px; gap: 6px; padding-left: 10px; }
  .stepper button { width: 32px; height: 32px; }
  .stepper span { min-width: 44px; }
  .stats b { font-size: 1.8rem; }
}
.sync-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); margin-right: 7px; }
.sync-dot.ok { background: var(--good); } .sync-dot.err { background: var(--bad); } .sync-dot.busy { background: var(--accent); }
.sync-help summary { font-weight: 700; color: var(--accent); cursor: pointer; padding: 4px 0; }
.sync-help ol { margin-top: 8px; font-size: .92rem; }
.sync-help a { word-break: break-all; }
.banner.warm { background: var(--warn-soft); }
.banner.wrap > div:first-child { min-width: 0; flex: 1 1 220px; }
</style>
</head>

      <p>An 8-week mobility program, ${p.target} sessions a week plus an optional Mobility Flow, about 20 minutes each. Built around your ${bells().join(', ').replace(/, (\d+)$/, ' and $1')} lb bells.</p>
      <p class="small muted">Learn each move with your lightest bell first. Swings and get-ups are worth one session with a certified kettlebell instructor, or at least a good video. Stop any move that causes sharp or pinching pain.</p>
      <div><button class="btn sm" data-act="welcome-ok">Got it</button></div></div>`;
  }
  html += `<div style="margin-top:12px">${heroCard(rec)}</div>`;
  // this week
  const wk = weekSessions(t), mon = mondayOf(t);
  const daysOn = new Set(wk.map(s => s.date));
  const names = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  html += `<div class="sec-head"><h2>This week</h2><span class="small muted num">${wk.length} of ${p.target} sessions${wk.length >= p.target ? ' · goal met' : ''}</span></div>
    <div class="card"><div class="week-strip" style="margin-top:0">${names.map((n, i) => { const d = addDays(mon, i); const on = daysOn.has(d); return `<div class="wd ${on ? 'on' : ''} ${d === t ? 'today' : ''}"><span>${n}</span><i>${on ? CHECK : ''}</i></div>`; }).join('')}</div>
    <p class="small muted" style="margin-top:12px">Weekly streak: <b class="num" style="color:var(--ink)">${weeklyStreak()}</b> ${weeklyStreak() === 1 ? 'week' : 'weeks'} hitting your goal.</p></div>`;
  html += `<div class="sec-head"><h2>Other options</h2></div>
    <div class="quick-grid">
      <button class="qbtn" data-act="gen-open" data-mins="10"><b>10 min</b><span>Short on time</span></button>
      <button class="qbtn" data-act="flow-now"><b>Mobility Flow</b><span>About 15 min, easy on joints</span></button>
      <button class="qbtn" data-act="gen-open"><b>Quick workout</b><span>Pick time and focus</span></button>
      <button class="qbtn" data-act="custom-open"><b>Build your own</b><span>Choose the moves</span></button>
    </div>`;
  const tip = TIPS[Math.floor(parseYmd(t) / 86400000) % TIPS.length];
  html += `<div class="sec-head"><h2>Coach’s note</h2></div><div class="card tip">${BELL()}<p>${esc(tip)}</p></div>`;
  return html;
}

function heroCard(rec) {
  const mark = `<svg class="slab-mark" viewBox="-11 -15 22 29" aria-hidden="true">${BELL_PATHS}</svg>`;
  if (rec.type === 'done') {
    const s = rec.last;
    const nx = rec.next ? programWorkout(rec.next.week, rec.next.letter) : null;
    return `<div class="slab">${mark}<p class="eyebrow">Done today</p><h1 class="h-display">Nice work</h1>
      <p class="meta">${esc(s.title)} · ${s.minutes || '–'} min${s.effort ? ` · effort ${s.effort}/10` : ''}</p>
      <p class="why">Recovery is part of the program. ${nx ? `Up next: ${esc(nx.title)}, ${esc(nx.name)}.` : ''}</p>
      <div class="row"><button class="btn" data-act="tab" data-tab="progress">See progress</button>${nx ? `<button class="btn" data-act="preview" data-key="${nx.key}">Preview next</button>` : ''}</div></div>`;

    const nx = programWorkout(rec.next.week, rec.next.letter);
    return `<div class="slab">${mark}<p class="eyebrow">Recommended today</p><h1 class="h-display">Mobility Flow</h1>
      <p class="meta">About ${estMin(w.items)} min · ${w.items.length} moves · light bells</p>
      <p class="why">You trained yesterday. A gentle flow or a full rest day both help you recover for ${esc(nx.title.replace('Week ', 'week '))}.</p>
      <div class="row"><button class="btn primary" data-act="start-key" data-key="${w.key}">Start flow</button><button class="btn" data-act="start-key" data-key="${nx.key}">Do workout ${rec.next.letter} instead</button></div>
      <div class="ex-list">${w.items.map(i => itemLine(i, true)).join('')}</div></div>`;
  }
  const w = programWorkout(rec.next.week, rec.next.letter);

  let why = rec.gap == null ? 'Your first session. Go slow and learn each movement.' : `Your last session was ${rec.gap} days ago, so you’re recovered and ready.`;
  if (wk >= p.target) why = `You’ve hit ${p.target} sessions this week. This one is a bonus, so keep it easy.`;
  const ph = PHASES[phaseOf(rec.next.week) - 1];
  return `<div class="slab">${mark}<p class="eyebrow">Recommended today · ${esc(ph.name)}</p>
    <p class="meta" style="margin-top:6px">${esc(w.title)}</p><h1 class="h-display">${esc(w.name)}</h1>
    <p class="meta">About ${estMin(w.items)} min · ${w.items.filter(i => i.sec === 'main').length} main moves</p>
    <p class="why">${why}</p>
    <div class="row"><button class="btn primary" data-act="start-key" data-key="${w.key}">Start workout</button></div>
    <div class="ex-list">${w.items.map(i => itemLine(i, true)).join('')}</div></div>`;
}

function viewPlan() {
  const p = state.profile, d = doneKeys(), next = nextProgram();

function viewLibrary() {
  const { q, tag } = state.lib;
  const ql = q.trim().toLowerCase();
  const list = Object.entries(EX).filter(([id, e]) =>
    (tag === 'all' || (tag === 'nobell' ? !e.bell : e.tags.includes(tag))) &&

    <div class="chips">${tagBtns.map(([k, l]) => `<button class="chip" data-act="lib-tag" data-tag="${k}" aria-pressed="${tag === k}">${esc(l)}</button>`).join('')}</div></div>

function libItem(id, e) {
  const open = state.open['lib-' + id];
  const best = bestOf(id);
  const inCustom = state.custom.includes(id);
  return `<div class="lib-item"><button data-act="toggle" data-k="lib-${id}" aria-expanded="${!!open}">
    <span class="nm"><b>${esc(e.name)}</b><span class="lvl ${e.level === 1 ? 'l1' : ''}">${LEVEL[e.level]}</span></span>
    <span class="tags">${e.tags.map(t => TAGS[t]).join(' · ')}${e.bell ? '' : ' · No bell'}</span></button>
    ${open ? `<div class="lib-body"><ol class="cues">${e.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ol>
      <dl class="kv"><dt>Feel it in</dt><dd>${esc(e.feel)}</dd><dt>Watch for</dt><dd>${esc(e.mistake)}</dd><dt>Easier</dt><dd>${esc(e.easier)}</dd><dt>Harder</dt><dd>${esc(e.harder)}</dd>${best ? `<dt>Your best</dt><dd class="num">${esc(best)}</dd>` : ''}</dl>
      <div class="row"><a href="${demoUrl(id)}" target="_blank" rel="noopener">Watch a demo ↗</a><span class="spacer" style="flex:1"></span><button class="btn sm" data-act="custom-add" data-ex="${id}">${inCustom ? 'Added ✓' : 'Add to my workout'}</button></div></div>` : ''}</div>`;
}
function bestOf(id) {
  let best = null;
  for (const s of state.sessions) for (const it of s.items || []) {
    if (it.ex !== id) continue;
    for (const x of it.sets || []) {
      if (!x.done) continue;
      const v = it.kind === 'time' ? x.secs : x.reps;
      if (!best || (x.lb || 0) > best.lb || ((x.lb || 0) === best.lb && v > best.v)) best = { lb: x.lb || 0, v, kind: it.kind };
    }
  }
  if (!best) return '';
  const what = best.kind === 'time' ? `${best.v}s` : `${best.v} reps`;
  return best.lb ? `${best.lb} lb × ${what}` : what;
}

/* ---------------- progress ---------------- */
function viewProgress() {
  const S = state.sessions, p = state.profile;
  if (!S.length) {
    return `<div class="empty" style="margin-top:8px">${BELL()}<h2 class="h-display" style="font-size:1.6rem">No sessions yet</h2>
      <p>Log your first workout and this page fills in: your weekly streak, a training calendar, how your joints feel over time, and weight progress for each move.</p>
      <button class="btn primary" data-act="tab" data-tab="today">Go to today’s workout</button></div>`;
  }
  const mins = S.reduce((n, s) => n + (s.minutes || 0), 0);
  const streak = weeklyStreak();
  let html = `<div class="stats" style="margin-top:4px">
    <div class="stat"><b>${streak}</b><span>Week streak</span></div>
    <div class="stat"><b>${S.length}</b><span>Sessions</span></div>
    <div class="stat"><b>${mins >= 600 ? Math.round(mins / 60) + 'h' : mins}</b><span>${mins >= 600 ? 'Hours' : 'Minutes'} trained</span></div></div>`;
  html += `<div class="sec-head"><h2>Last 12 weeks</h2><span class="small muted">Goal: ${p.target} a week</span></div><div class="card">${heatmap()}<div class="readout" id="ro-heat">Tap a day to see what you did.</div>
    <div class="legend"><span><i style="background:var(--heat0)"></i>Rest</span><span><i style="background:var(--heat1)"></i>Under 15 min</span><span><i style="background:var(--heat2)"></i>15–25</span><span><i style="background:var(--heat3)"></i>Over 25</span></div></div>`;
  const recent = S.slice(0, 16).reverse();
  const jp = recent.filter(s => s.joints).map(s => ({ y: s.joints, x: s.date, tip: `${fmtDay(s.date)}: joints felt ${JOINTS[s.joints].toLowerCase()} after ${s.title}` }));
  html += `<div class="sec-head"><h2>How your joints felt</h2></div><div class="card">${jp.length ? lineChart('joints', jp, 1, 3, [[1, 'Stiff'], [2, 'Okay'], [3, 'Loose']]) : '<p class="muted small">Rate your joints when you log a session to see this trend.</p>'}</div>`;
  const ep = recent.filter(s => s.effort).map(s => ({ y: s.effort, x: s.date, tip: `${fmtDay(s.date)}: effort ${s.effort}/10 (${effortWord(s.effort).toLowerCase()}) · ${s.title}` }));
  html += `<div class="sec-head"><h2>Effort</h2><span class="small muted">1 easy · 10 all-out</span></div><div class="card">${ep.length ? lineChart('effort', ep, 0, 10, [[0, '0'], [5, '5'], [10, '10']]) : '<p class="muted small">Rate effort when you log a session to see this trend.</p>'}</div>`;
  // exercise progress
  const counts = {};
  S.forEach(s => (s.items || []).forEach(it => { if (!EX[it.ex] || EX[it.ex].drill) return; if (it.sets.some(x => x.done)) counts[it.ex] = (counts[it.ex] || 0) + 1; }));
  const exIds = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (exIds.length) {
    if (!state.exSel || !counts[state.exSel]) state.exSel = exIds[0];
    const id = state.exSel, kind = EX[id].kind;
    const pts = S.slice().reverse().map(s => {
      const it = (s.items || []).find(i => i.ex === id && i.sets.some(x => x.done)); if (!it) return null;
      const done = it.sets.filter(x => x.done);
      const sides = it.per ? 2 : 1;
      const total = done.reduce((n, x) => n + (kind === 'time' ? x.secs : x.reps) * sides, 0);
      const top = Math.max(...done.map(x => x.lb || 0));
      return { y: total, x: s.date, tip: `${fmtDay(s.date)}: ${done.length} sets, ${total}${kind === 'time' ? 's' : ' reps'} total${top ? ` at up to ${top} lb` : ''}` };
    }).filter(Boolean).slice(-16);
    const maxY = Math.max(...pts.map(p => p.y));
    const niceMax = maxY <= 10 ? 10 : Math.ceil(maxY / 10) * 10;
    html += `<div class="sec-head"><h2>Move progress</h2></div><div class="card stack">
      <select class="select" id="ex-sel" aria-label="Choose a move">${exIds.map(e => `<option value="${e}" ${e === id ? 'selected' : ''}>${esc(EX[e].name)}</option>`).join('')}</select>
      <div class="small muted">Total ${kind === 'time' ? 'seconds' : 'reps'} per session${bestOf(id) ? ` · best set: <b style="color:var(--ink)">${esc(bestOf(id))}</b>` : ''}</div>
      ${lineChart('ex', pts, 0, niceMax, [[0, '0'], [niceMax / 2, String(niceMax / 2)], [niceMax, String(niceMax)]])}</div>`;
  }
  html += `<div class="sec-head"><h2>History</h2><button class="link-btn small" data-act="export">Export CSV</button></div><div class="stack">`;
  for (const s of S) html += histItem(s);
  html += `</div>`;
  return html;
}
function lineChart(id, pts, yMin, yMax, ticks) {
  const W = 340, H = 150, L = 40, R = 12, T = 12, B = 24;
  const n = pts.length;
  const xs = i => n <= 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1);
  const ys = v => T + (1 - (v - yMin) / (yMax - yMin)) * (H - T - B);
  let g = '';
  for (const [v, lab] of ticks) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text class="axis" x="${L - 6}" y="${ys(v) + 3.5}" text-anchor="end">${esc(lab)}</text>`;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(p.y).toFixed(1)}`).join(' ');
  const area = n > 1 ? `<path class="area" d="${d} L${xs(n - 1).toFixed(1)},${ys(yMin)} L${xs(0).toFixed(1)},${ys(yMin)} Z"/>` : '';
  const dots = pts.map((p, i) => `<circle class="pt ${i === n - 1 ? 'sel' : ''}" data-i="${i}" cx="${xs(i).toFixed(1)}" cy="${ys(p.y).toFixed(1)}" r="${i === n - 1 ? 5 : 4}"/>`).join('');
  const hits = pts.map((p, i) => `<circle class="hit" data-act="pt" data-chart="${id}" data-i="${i}" data-tip="${esc(p.tip)}" cx="${xs(i).toFixed(1)}" cy="${ys(p.y).toFixed(1)}" r="14"><title>${esc(p.tip)}</title></circle>`).join('');
  const xl = `<text class="axis" x="${xs(0)}" y="${H - 6}" text-anchor="${n > 1 ? 'start' : 'middle'}">${fmtShort(pts[0].x)}</text>` + (n > 1 ? `<text class="axis" x="${xs(n - 1)}" y="${H - 6}" text-anchor="end">${fmtShort(pts[n - 1].x)}</text>` : '');
  return `<svg class="chart" id="ch-${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(id)} chart">${g}${area}${n > 1 ? `<path class="ln" d="${d}"/>` : ''}${dots}${xl}${hits}</svg><div class="readout" id="ro-${id}">${esc(pts[n - 1].tip)}</div>`;
}
function heatmap() {
  const t = today(), start = addDays(mondayOf(t), -77);
  const byDay = {};
  state.sessions.forEach(s => { (byDay[s.date] = byDay[s.date] || []).push(s); });
  const cs = 22, gap = 3, L = 22, T = 4;
  let g = '';
  ['M', '', 'W', '', 'F', '', 'S'].forEach((l, r) => { if (l) g += `<text class="axis" x="${L - 8}" y="${T + r * (cs + gap) + cs / 2 + 3.5}" text-anchor="end">${l}</text>`; });
  for (let c = 0; c < 12; c++) {
    let cnt = 0;
    for (let r = 0; r < 7; r++) {
      const d = addDays(start, c * 7 + r);
      if (d > t) continue;
      const ss = byDay[d] || []; cnt += ss.length;
      const m = ss.reduce((n, s) => n + (s.minutes || 0), 0);
      const lv = !ss.length ? 0 : m < 15 ? 1 : m <= 25 ? 2 : 3;
      const tip = ss.length ? `${fmtDay(d)}: ${ss.map(s => `${s.title} (${s.minutes || '–'} min)`).join(', ')}` : `${fmtDay(d)}: rest day`;
      const x = L + c * (cs + gap), y = T + r * (cs + gap);
      g += `<rect class="cell h${lv}" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="5" data-act="cell" data-tip="${esc(tip)}"><title>${esc(tip)}</title></rect>`;
      if (d === t) g += `<rect class="todayc" x="${x + 0.75}" y="${y + 0.75}" width="${cs - 1.5}" height="${cs - 1.5}" rx="4.5"/>`;
    }
    const x = L + c * (cs + gap) + cs / 2;
    if (cnt || c === 11) g += `<text class="wc ${cnt >= state.profile.target ? 'met' : ''}" x="${x}" y="${T + 7 * (cs + gap) + 11}" text-anchor="middle">${cnt}</text>`;
  }
  const W = L + 12 * (cs + gap), H = T + 7 * (cs + gap) + 16;
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Training calendar, last 12 weeks. Numbers under each column are sessions that week.">${g}</svg></div>`;
}
function histItem(s) {
  const open = state.open['h-' + s.id];
  const sets = (s.items || []).reduce((n, i) => n + i.sets.filter(x => x.done).length, 0);
  const vol = volumeOf(s);
  let body = '';
  if (open) {
    const lines = (s.items || []).filter(i => i.sets.some(x => x.done)).map(i => {
      const done = i.sets.filter(x => x.done);
      const vals = done.map(x => i.kind === 'time' ? `${x.secs}s` : x.reps);
      const lbs = [...new Set(done.map(x => x.lb || 0))];
      return `<div class="ex-li"><span class="n">${esc(EX[i.ex] ? EX[i.ex].name : i.ex)}</span><span class="t">${vals.join(', ')}${perTxt(i.per)}${lbs.some(Boolean) ? ` · ${lbs.map(v => v ? v + ' lb' : 'BW').join('/')}` : ''}</span></div>`;
    }).join('');
    const confirming = state.confirmDel === s.id;
    body = `<div class="hist-body"><div class="ex-list">${lines || '<p class="muted small">No sets marked done.</p>'}</div>
      ${s.notes ? `<p class="small" style="white-space:pre-wrap">${esc(s.notes)}</p>` : ''}
      ${confirming ? `<div class="banner" style="margin:0;background:var(--warn-soft)"><p class="small">Delete this session for good?</p><div class="row"><button class="btn sm" data-act="del-no">Keep</button><button class="btn sm danger" data-act="del-yes" data-id="${s.id}">Delete</button></div></div>`
        : `<div class="row"><button class="btn sm" data-act="edit-log" data-id="${s.id}">Edit details</button><button class="btn sm danger" data-act="del-ask" data-id="${s.id}">Delete</button></div>`}</div>`;
  }
  return `<div class="hist-item"><button data-act="toggle" data-k="h-${s.id}" aria-expanded="${!!open}">
    <span class="hist-top"><b>${esc(s.title)}</b><span class="small muted num">${fmtDay(s.date)}</span></span>
    <span class="badges"><span class="badge num">${s.minutes || '–'} min</span><span class="badge num">${sets} sets</span>${vol ? `<span class="badge num">${vol.toLocaleString()} lb moved</span>` : ''}${s.effort ? `<span class="badge">Effort ${s.effort}</span>` : ''}${s.joints ? `<span class="badge ${s.joints === 3 ? 'good' : s.joints === 1 ? 'warn' : ''}">Joints: ${JOINTS[s.joints].toLowerCase()}</span>` : ''}${(s.sore || []).map(k => `<span class="badge warn">Sore: ${SORE[k].toLowerCase()}</span>`).join('')}</span></button>${body}</div>`;
}

      for (let attempt = 0; attempt < 4 && !done; attempt++) {
        const remote = await readRemote();
        const local = C.snapshot();
        const merged = merge(local, remote.data || {});
        if (norm(merged) !== norm(local)) {
          const before = new Set((local.sessions || []).map(s => s.id));
          brought += merged.sessions.filter(s => !before.has(s.id)).length;
          C.apply(merged);
        }
        if (remote.data && norm(merged) === norm(remote.data)) done = true;
        else done = await writeRemote(merged, remote.sha);
      }
      if (!done) throw new SyncError('other', 'Another device kept saving at the same moment.');
      cfg.lastSync = Date.now(); cfg.error = null; cfg.dirty = false; save(); setStatus('ok');
      if (brought) toast(`Brought back ${brought} session${brought === 1 ? '' : 's'} from GitHub`);
    } catch (e) {
      cfg.error = { kind: e.kind || 'other', msg: String(e.message || '') }; save(); setStatus('error');
      if (e.kind === 'rate' || e.kind === 'other') schedule(60000);
    } finally {
      busy = false;
      if (again) { again = false; schedule(800); }
    }
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(run, ms); }
  const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
  const MSG = {
    offline: 'Waiting for a connection. Your log is safe on this phone and will sync when you’re back online.',
    token: 'GitHub didn’t accept the access token. It may have expired or been mistyped.',
    perm: 'The token can’t save to that repository. In the token’s settings, set Contents to Read and write.',
    repo: 'Can’t find that repository, or the token doesn’t include it. Check the name and the token’s repository access.',
    rate: 'GitHub is limiting requests for a moment. Sync will retry by itself.',
    file: '',
    other: ''
  };
  const needsFix = () => cfg.token && cfg.error && ['token', 'perm', 'repo', 'file'].includes(cfg.error.kind);
  function statusText() {
    if (!cfg.token) return 'Off';
    if (status === 'syncing') return 'Syncing…';
    if (cfg.error) return MSG[cfg.error.kind] || `Sync didn’t finish: ${cfg.error.msg}. It will retry.`;
    if (cfg.dirty) return 'Changes waiting to sync.';
    return cfg.lastSync ? `Synced ${ago(cfg.lastSync)}.` : 'Connected.';
  }
  const dotCls = () => !cfg.token ? '' : status === 'syncing' ? 'busy' : cfg.error && cfg.error.kind !== 'offline' ? 'err' : 'ok';
  function setStatus(s) {
    status = s;
    const el = document.getElementById('sync-status');
    if (el) { el.textContent = statusText(); const d = document.getElementById('sync-dot'); if (d) d.className = 'sync-dot ' + dotCls(); }
    const mode = !cfg.token ? 'off' : needsFix() ? 'fix:' + cfg.error.kind : 'on';
    if (mode !== lastMode) {
      lastMode = mode;
      const f = document.getElementById('sync-field'), a = document.activeElement;
      if (f && !(a && f.contains(a) && a.tagName === 'INPUT')) f.outerHTML = fieldHtml();
      if (state.tab === 'today' && !document.querySelector('#view input:focus')) render();
    }
  }
  const tokenInputs = (cta) => `<label for="sync-repo">Repository</label><input class="input" id="sync-repo" value="${esc(cfg.repo)}" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
      <label for="sync-token">Access token</label><input class="input" id="sync-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
      <p class="hint">The token stays on this phone and only opens that one repository.</p>
      <div><button class="btn sm primary" data-act="sync-connect">${cta}</button></div>`;
  const steps = `<details class="sync-help"${cfg.token ? '' : ' open'}><summary>How to set it up</summary><ol class="cues">
      <li>On GitHub, create a <b>private</b> repository named <b>fitness-log</b>.</li>
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>. Name the token “Fitness apps sync” and choose the longest expiration offered.</li>
      <li>Under <b>Repository access</b>, choose <b>Only select repositories</b>, then <b>fitness-log</b>.</li>
      <li>Under <b>Permissions</b>, add <b>Contents</b> and set it to <b>Read and write</b>.</li>
      <li>Tap <b>Generate token</b>, copy it, and paste it below.</li></ol></details>`;
  function fieldHtml() {
    lastMode = !cfg.token ? 'off' : needsFix() ? 'fix:' + cfg.error.kind : 'on';
    if (!cfg.token) return `<div class="field" id="sync-field"><span class="lbl">Sync to GitHub</span>
      <p class="small muted">Saves every session to a private GitHub repository, so app updates, deleting the app or a new phone never lose your history. Bell Flow and Limber can share the same repository.</p>
      ${steps}${tokenInputs('Connect and sync')}</div>`;
    return `<div class="field" id="sync-field"><span class="lbl">Sync to GitHub</span>
      <p class="small"><span class="sync-dot ${dotCls()}" id="sync-dot"></span><span id="sync-status">${esc(statusText())}</span></p>
      <p class="small muted">Saving to ${esc(cfg.repo)}, file ${esc(C.file)}.</p>
      ${needsFix() ? steps + tokenInputs('Save and sync') : `<div class="row"><button class="btn sm" data-act="sync-now">Sync now</button><button class="btn sm danger" data-act="sync-disconnect">Disconnect</button></div>`}</div>`;
  }
  function bannerHtml() {
    if (needsFix()) return `<div class="banner wrap warm" style="margin-top:12px"><div><p>Sync has stopped</p><span class="small">${esc(MSG[cfg.error.kind] || cfg.error.msg)}</span></div><button class="btn sm primary" data-act="sync-fix">Fix</button></div>`;
    if (!cfg.token && C.count() >= 1 && LS.get(K.nudge, '') !== 'hide') return `<div class="banner wrap" style="margin-top:12px"><div><p>Keep your history safe</p><span class="small">Turn on sync so app updates, deleting the app or a new phone never lose a session.</span></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="sync-nudge-hide">Not now</button><button class="btn sm primary" data-act="sync-fix">Set up</button></div></div>`;
    return '';
  }
  async function connect() {
    const repo = (document.getElementById('sync-repo') || {}).value || cfg.repo;
    const token = ((document.getElementById('sync-token') || {}).value || '').trim();
    const r = repo.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
    if (!/^[\w.-]+\/[\w.-]+$/.test(r)) { toast('Enter the repository as username/name, like evan579/fitness-log'); return; }
    if (!token) { toast('Paste your access token first'); return; }
    cfg.repo = r; cfg.token = token; cfg.error = null; save();
    toast('Connecting…');
    await run();
    if (!cfg.error) toast(`Synced with ${cfg.repo}`);
    else if (!needsFix()) toast(statusText());
    if (typeof sheetCtx !== 'undefined' && sheetCtx && sheetCtx.type === 'settings') openSettings();
  }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act^="sync-"]'); if (!el) return;
    switch (el.dataset.act) {
      case 'sync-connect': connect(); break;
      case 'sync-now': cfg.error = null; run(); break;
      case 'sync-disconnect': cfg.token = ''; cfg.error = null; save(); setStatus('off'); openSettings(); toast('Sync turned off. Your log stays on this phone.'); break;
      case 'sync-fix': openSettings(); setTimeout(() => { const f = document.getElementById('sync-field'); if (f) f.scrollIntoView({ block: 'start' }); }, 50); break;
      case 'sync-nudge-hide': LS.set(K.nudge, 'hide'); render(); break;
    }
  });
  return {
    on: () => !!cfg.token,
    changed() { cfg.dirty = true; save(); if (cfg.token) schedule(1500); },
    start() {
      if (cfg.token) run();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cfg.token && (cfg.dirty || Date.now() - cfg.lastSync > 60000)) run(); });
      window.addEventListener('online', () => { if (cfg.token) run(); });
    },
    fieldHtml, bannerHtml, merge, run
  };
})();

/* ---------------- boot ---------------- */
let swReg = null, swUpdating = false;
render();
Sync.start();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      swReg = reg;
      const ready = () => { if (reg.waiting && navigator.serviceWorker.controller) $('#update-bar').hidden = false; };
      ready();
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') ready(); }); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (swUpdating) location.reload(); });
  });
}
</script>
</body>
</html>
